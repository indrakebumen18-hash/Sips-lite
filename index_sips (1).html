<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIPS - Sistem Informasi Pembinaan Santri</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* ========================================== */
        /* --- CSS Reset & Variables ---              */
        /* ========================================== */
        :root {
            --primary: #2563eb; --primary-hover: #1d4ed8;
            --bg-color: #f3f4f6; --surface: #ffffff; --surface-hover: #f9fafb;
            --text-main: #111827; --text-muted: #6b7280; --border: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --radius-md: 12px; --radius-lg: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            
            --danger: #ef4444; --danger-hover: #dc2626;
            --warning: #f59e0b; --success: #10b981; --info: #3b82f6;

            --badge-green-bg: #d1fae5; --badge-green-text: #065f46;
            --badge-yellow-bg: #fef3c7; --badge-yellow-text: #92400e;
            --badge-orange-bg: #ffedd5; --badge-orange-text: #9a3412;
            --badge-red-bg: #fee2e2; --badge-red-text: #991b1b;
            --badge-gray-bg: #f3f4f6; --badge-gray-text: #374151;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a; --surface: #1e293b; --surface-hover: #334155;
            --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155;
            --shadow-sm: 0 1px 2px 0 rgba(0,0,0, 0.3); --shadow-md: 0 4px 6px -1px rgba(0,0,0, 0.4); --shadow-lg: 0 10px 15px -3px rgba(0,0,0, 0.5);
            --badge-green-bg: rgba(16, 185, 129, 0.2); --badge-green-text: #34d399;
            --badge-yellow-bg: rgba(245, 158, 11, 0.2); --badge-yellow-text: #fbbf24;
            --badge-orange-bg: rgba(249, 115, 22, 0.2); --badge-orange-text: #fb923c;
            --badge-red-bg: rgba(239, 68, 68, 0.2); --badge-red-text: #f87171;
            --badge-gray-bg: rgba(107, 114, 128, 0.2); --badge-gray-text: #d1d5db;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); transition: background-color 0.3s ease, color 0.3s ease; overflow: hidden; }

        /* ========================================== */
        /* --- Layout ---                             */
        /* ========================================== */
        .app-container { display: grid; grid-template-areas: "header header" "sidebar content"; grid-template-columns: 260px 1fr; grid-template-rows: 70px 1fr; height: 100vh; width: 100vw; }
        
        .header { grid-area: header; background-color: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; z-index: 20; box-shadow: var(--shadow-sm); }
        .header-left, .header-right { display: flex; align-items: center; gap: 16px; }
        .menu-toggle { display: none; background: none; border: none; color: var(--text-main); cursor: pointer; padding: 8px; border-radius: 8px; }
        .brand-logo { display: flex; align-items: center; gap: 12px; }
        .brand-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--primary), #60a5fa); border-radius: 10px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 18px; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3); }
        .brand-text h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.5px; }
        .brand-text p { font-size: 12px; color: var(--text-muted); }
        .theme-toggle { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--border); background-color: var(--surface); color: var(--text-main); font-size: 18px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
        .theme-toggle:hover { background-color: var(--surface-hover); transform: scale(1.08); box-shadow: var(--shadow-sm); }
        
        /* Sidebar */
        .sidebar { grid-area: sidebar; background-color: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 24px 16px; overflow-y: auto; z-index: 10; }
        .menu-group { margin-bottom: 24px; }
        .menu-group-title { font-size: 11px; text-transform: uppercase; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; margin-bottom: 12px; padding-left: 12px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-md); color: var(--text-main); text-decoration: none; font-size: 14px; font-weight: 500; margin-bottom: 4px; transition: var(--transition); cursor: pointer; }
        .menu-item svg { width: 20px; height: 20px; stroke: var(--text-muted); transition: var(--transition); }
        .menu-item:hover { background-color: var(--surface-hover); }
        .menu-item.active { background-color: rgba(37, 99, 235, 0.1); color: var(--primary); }
        .menu-item.active svg { stroke: var(--primary); }

        /* Main Content */
        .main-content { grid-area: content; padding: 32px; overflow-y: auto; position: relative; scroll-behavior: smooth; }
        .page-header { margin-bottom: 32px; animation: slideDown 0.4s ease-out; }
        .page-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .page-subtitle { color: var(--text-muted); font-size: 14px; }

        /* ========================================== */
        /* --- UI Components ---                      */
        /* ========================================== */
        .card { background-color: var(--surface); border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden; animation: fadeIn 0.4s ease-out; }
        .card-body { padding: 24px; }
        .card-interactive { cursor: pointer; transition: var(--transition); }
        .card-interactive:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--primary); }
        
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; animation: fadeIn 0.4s ease-out; }
        .toolbar-left { display: flex; gap: 12px; flex: 1; flex-wrap: wrap; align-items: center; }
        .search-box { position: relative; flex: 1; min-width: 200px; max-width: 400px; }
        .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--text-muted); }
        .search-input { width: 100%; padding: 10px 16px 10px 40px; border-radius: 8px; border: 1px solid var(--border); background-color: var(--surface); color: var(--text-main); font-size: 14px; outline: none; transition: var(--transition); }
        .filter-select { padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border); background-color: var(--surface); color: var(--text-main); font-size: 14px; outline: none; cursor: pointer; min-width: 140px; }
        .search-input:focus, .filter-select:focus, .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        .btn { padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; transition: var(--transition); outline: none; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-danger:hover { background-color: var(--danger-hover); }
        .btn-outline { background-color: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-outline:hover { background-color: var(--surface-hover); }
        .btn-icon { padding: 6px; border-radius: 6px; background: transparent; border: 1px solid transparent; color: var(--text-muted); cursor: pointer; transition: var(--transition); }
        .btn-icon:hover { background-color: var(--surface-hover); color: var(--text-main); }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
        .form-control { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background-color: var(--surface); color: var(--text-main); font-size: 14px; outline: none; transition: var(--transition); }
        .form-control[readonly], .form-control[disabled] { background-color: var(--surface-hover); cursor: not-allowed; color: var(--text-muted); }
        textarea.form-control { resize: vertical; min-height: 80px; }

        .panel-penanganan { padding: 24px; border-radius: var(--radius-lg); margin-top: 24px; transition: var(--transition); display: flex; align-items: center; gap: 20px; border: 1px solid transparent; }
        .panel-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .panel-icon svg { width: 28px; height: 28px; }
        .panel-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .panel-value { font-size: 22px; font-weight: 700; }
        .level-gray { background-color: var(--badge-gray-bg); border-color: var(--border); color: var(--text-main); }
        .level-gray .panel-icon { background-color: var(--surface); color: var(--text-muted); }
        .level-green { background-color: var(--badge-green-bg); color: var(--badge-green-text); }
        .level-green .panel-icon { background-color: rgba(255,255,255,0.5); }
        .level-yellow { background-color: var(--badge-yellow-bg); color: var(--badge-yellow-text); }
        .level-yellow .panel-icon { background-color: rgba(255,255,255,0.5); }
        .level-orange { background-color: var(--badge-orange-bg); color: var(--badge-orange-text); }
        .level-orange .panel-icon { background-color: rgba(255,255,255,0.5); }
        .level-red { background-color: var(--badge-red-bg); color: var(--badge-red-text); }
        .level-red .panel-icon { background-color: rgba(255,255,255,0.5); }

        /* Tables & Tabs */
        .table-container { width: 100%; overflow-x: auto; }
        .table { width: 100%; border-collapse: collapse; text-align: left; }
        .table th { background-color: var(--surface-hover); padding: 14px 20px; font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1; }
        .table td { padding: 14px 20px; font-size: 14px; border-bottom: 1px solid var(--border); color: var(--text-main); vertical-align: middle; }
        .table tbody tr:hover { background-color: var(--surface-hover); }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; white-space: nowrap; }
        .badge.green { background-color: var(--badge-green-bg); color: var(--badge-green-text); }
        .badge.yellow { background-color: var(--badge-yellow-bg); color: var(--badge-yellow-text); }
        .badge.orange { background-color: var(--badge-orange-bg); color: var(--badge-orange-text); }
        .badge.red { background-color: var(--badge-red-bg); color: var(--badge-red-text); }
        .badge.gray { background-color: var(--badge-gray-bg); color: var(--badge-gray-text); }
        
        .clickable-name { color: var(--primary); font-weight: 600; cursor: pointer; text-decoration: none; transition: color 0.2s; }
        .clickable-name:hover { text-decoration: underline; }

        .tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--border); margin-bottom: 24px; flex-wrap: wrap; }
        .tab-btn { padding: 12px 20px; font-size: 14px; font-weight: 600; color: var(--text-muted); cursor: pointer; border: none; background: transparent; border-bottom: 2px solid transparent; transition: var(--transition); }
        .tab-btn:hover { color: var(--text-main); }
        .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* Pure CSS Charts */
        .css-chart { display: flex; align-items: flex-end; justify-content: space-around; height: 160px; padding: 20px 10px 0; gap: 8px; }
        .chart-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; width: 100%; max-width: 40px; position: relative; height: 100%; }
        .chart-bar { width: 100%; background: linear-gradient(to top, var(--primary), #60a5fa); border-radius: 4px 4px 0 0; min-height: 4px; transition: height 0.6s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 6px rgba(37, 99, 235, 0.2); }
        .chart-val { font-size: 11px; font-weight: 700; color: var(--text-main); position: absolute; top: -20px; }
        .chart-lbl { font-size: 10px; font-weight: 500; color: var(--text-muted); margin-top: 8px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 50px; }
        .chart-col-clickable { cursor: pointer; border-radius: 8px; transition: var(--transition); }
        .chart-col-clickable:hover { background-color: var(--surface-hover); }
        .chart-col-clickable:hover .chart-bar { filter: brightness(1.15); }
        .period-nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
        .period-nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Modals & Toasts */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(2px); padding: 20px; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-card { background-color: var(--surface); width: 100%; max-width: 600px; border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); transform: translateY(20px) scale(0.95); transition: transform 0.3s ease; max-height: 90vh; display: flex; flex-direction: column; }
        .modal-overlay.active .modal-card { transform: translateY(0) scale(1); }
        .modal-header { padding: 20px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-title { font-size: 18px; font-weight: 700; }
        .modal-close { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; border-radius: 4px; transition: var(--transition); }
        .modal-body { padding: 24px; overflow-y: auto; }
        .modal-footer { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 12px; background-color: var(--surface-hover); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }

        .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 20px; text-align: center; }
        .empty-icon { width: 80px; height: 80px; background-color: var(--surface-hover); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; color: var(--text-muted); }
        .empty-icon svg { width: 40px; height: 40px; stroke-width: 1.5; }
        .empty-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
        .empty-desc { color: var(--text-muted); font-size: 14px; margin-bottom: 24px; max-width: 300px; line-height: 1.5; }

        #toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 12px; z-index: 9999; }
        .toast { background-color: var(--surface); color: var(--text-main); padding: 16px 24px; border-radius: var(--radius-md); box-shadow: var(--shadow-lg); border-left: 4px solid var(--primary); display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; transform: translateX(120%); opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); }
        .toast.show { transform: translateX(0); opacity: 1; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* Responsive */
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 5; opacity: 0; transition: opacity 0.3s ease; }
        @media (max-width: 768px) {
            .app-container { grid-template-areas: "header" "content"; grid-template-columns: 1fr; }
            .menu-toggle { display: block; }
            .sidebar { position: fixed; top: 70px; left: -260px; bottom: 0; width: 260px; box-shadow: var(--shadow-lg); }
            .sidebar.open { left: 0; }
            .sidebar-overlay.active { display: block; opacity: 1; }
            .main-content { padding: 20px 16px; padding-bottom: 90px; }
            .form-grid { grid-template-columns: 1fr; gap: 0; }
            
            .btn-add-desktop span { display: none; }
            .btn-add-desktop { position: fixed; bottom: 24px; right: 24px; width: 56px; height: 56px; border-radius: 50%; padding: 0; z-index: 50; box-shadow: var(--shadow-lg); }
            .btn-add-desktop svg { width: 24px; height: 24px; margin: 0; }

            .table-container { background: transparent; border: none; box-shadow: none; border-radius: 0; padding-bottom: 20px; }
            .table thead { display: none; }
            .table tbody { display: grid; gap: 16px; }
            .table tr { background-color: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); display: block; padding: 16px; box-shadow: var(--shadow-sm); }
            .table td { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--border); text-align: right; }
            .table td:last-child { border-bottom: none; padding-bottom: 0; justify-content: flex-end; margin-top: 8px; }
            .table td::before { content: attr(data-label); font-weight: 600; color: var(--text-muted); font-size: 12px; text-transform: uppercase; text-align: left; margin-right: 16px; }
            .actions { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <button class="menu-toggle" id="menuToggle" aria-label="Buka Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
                <div class="brand-logo">
                    <div class="brand-icon">S</div>
                    <div class="brand-text"><h1>SIPS</h1><p>Sistem Informasi Pembinaan Santri</p></div>
                </div>
            </div>
            <div class="header-right">
                <button class="theme-toggle" id="themeToggle" aria-label="Ubah Tema (Siang/Malam)" title="Ubah Tema (Siang/Malam)" onclick="ViewPengaturan.toggleTheme()">☀️</button>
            </div>
        </header>

        <!-- Sidebar -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar" id="sidebar">
            <div class="menu-group">
                <div class="menu-group-title">Utama</div>
                <a class="menu-item active" data-view="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"></rect><rect x="14" y="3" width="7" height="5" rx="1"></rect><rect x="14" y="12" width="7" height="9" rx="1"></rect><rect x="3" y="16" width="7" height="5" rx="1"></rect></svg> Dashboard</a>
            </div>

            <div class="menu-group">
                <div class="menu-group-title">Operasional</div>
                <a class="menu-item" data-view="input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg> Input Pelanggaran</a>
                <a class="menu-item" data-view="riwayat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> Riwayat</a>
                <a class="menu-item" data-view="rekap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg> Rekap</a>
            </div>

            <div class="menu-group">
                <div class="menu-group-title">Data Dasar</div>
                <a class="menu-item" data-view="kelas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg> Kelas</a>
                <a class="menu-item" data-view="santri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg> Santri</a>
                <a class="menu-item" data-view="kategori"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path></svg> Kategori</a>
                <a class="menu-item" data-view="penanganan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg> Penanganan</a>
            </div>
            
            <div class="menu-group" style="margin-top: auto;">
                <a class="menu-item" data-view="pengaturan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33h.09a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> Pengaturan</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" id="mainContent"></main>
    </div>

    <!-- Modals & Toasts -->
    <div class="modal-overlay" id="modalOverlay"><div class="modal-card" id="modalCard"></div></div>
    <div id="toast-container"></div>
    <input type="file" id="restoreFileInput" accept=".json" style="display:none">

    <!-- ========================================== -->
    <!-- MULAI: app.js                              -->
    <!-- ========================================== -->
    <script>
        /**
         * SIPS - Phase 5 (Finalisasi Produksi v1.0)
         * Arsitektur: IIFE Modular, Vanilla JS, Event Delegation
         */

        // --- 1. CORE UTILITIES ---
        const Utils = {
            generateId: () => Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
            escapeHTML: (str) => { const div = document.createElement('div'); div.textContent = str || ''; return div.innerHTML; },
            formatDate: (dateStr) => {
                if(!dateStr) return '-'; const d = new Date(dateStr);
                const m = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
                return `${d.getDate().toString().padStart(2,'0')} ${m[d.getMonth()]} ${d.getFullYear()}`;
            },
            getDayName: (dateStr) => ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'][new Date(dateStr).getDay()],
            getTodayYMD: () => { const d = new Date(); return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`; },
            isToday: (dateStr) => new Date(dateStr).toDateString() === new Date().toDateString(),
            isThisWeek: (dateStr) => {
                const d = new Date(dateStr), today = new Date();
                const day = today.getDay() || 7; 
                const monday = new Date(today); monday.setDate(today.getDate() - day + 1); monday.setHours(0,0,0,0);
                const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23,59,59,999);
                return d >= monday && d <= sunday;
            },
            getMonday: (d) => { const day = d.getDay() || 7; const m = new Date(d); m.setDate(d.getDate() - day + 1); m.setHours(0,0,0,0); return m; },
            toYMD: (d) => `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`,
            inRange: (dateStr, start, end) => { const d = new Date(dateStr + 'T00:00:00'); return d >= start && d <= end; },
            getWeekRange: (offset = 0) => {
                const monday = Utils.getMonday(new Date()); monday.setDate(monday.getDate() + (offset * 7));
                const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6); sunday.setHours(23,59,59,999);
                return { start: monday, end: sunday };
            },
            getMonthRange: (offset = 0) => {
                const today = new Date();
                const base = new Date(today.getFullYear(), today.getMonth() + offset, 1);
                const start = new Date(base.getFullYear(), base.getMonth(), 1); start.setHours(0,0,0,0);
                const end = new Date(base.getFullYear(), base.getMonth() + 1, 0); end.setHours(23,59,59,999);
                return { start, end };
            },
            getWeekOfMonth: (mondayDate) => {
                const firstOfMonth = new Date(mondayDate.getFullYear(), mondayDate.getMonth(), 1);
                const firstMonday = Utils.getMonday(firstOfMonth);
                const diffDays = Math.round((mondayDate - firstMonday) / 86400000);
                return Math.floor(diffDays / 7) + 1;
            },
            monthNames: ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'],
            isThisMonth: (dateStr) => {
                const d = new Date(dateStr), today = new Date();
                return d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear();
            },
            getPast7Days: () => {
                return Array.from({length: 7}, (_, i) => {
                    const d = new Date(); d.setDate(d.getDate() - (6 - i));
                    return { date: `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')}`, label: ['Min','Sen','Sel','Rab','Kam','Jum','Sab'][d.getDay()] };
                });
            },
            colorMap: { 'Hijau': 'green', 'Kuning': 'yellow', 'Oranye': 'orange', 'Merah': 'red' }
        };

        // --- 2. STORAGE MANAGEMENT (AUTO SAVE) ---
        const Storage = (function() {
            const SCHEMA = { kelas: [], santri: [], kategori: [], penanganan: [], pelanggaran: [], pengaturan: { tema: 'light' } };
            
            const init = () => {
                Object.keys(SCHEMA).forEach(k => { if (!localStorage.getItem(`sips_${k}`)) set(k, SCHEMA[k]); });
            };
            const get = (t) => JSON.parse(localStorage.getItem(`sips_${t}`)) || (Array.isArray(SCHEMA[t]) ? [] : {});
            const set = (t, d) => localStorage.setItem(`sips_${t}`, JSON.stringify(d)); // Real-time save
            const getById = (t, id) => get(t).find(i => i.id === id);
            
            const insert = (t, data) => {
                const tableData = get(t);
                data.id = Utils.generateId();
                data.createdAt = Date.now();
                tableData.push(data);
                set(t, tableData);
                return data;
            };
            const update = (t, id, data) => {
                const tableData = get(t);
                const idx = tableData.findIndex(i => i.id === id);
                if (idx !== -1) { tableData[idx] = { ...tableData[idx], ...data }; set(t, tableData); }
            };
            const remove = (t, id) => set(t, get(t).filter(i => i.id !== id));

            return { init, get, set, insert, update, remove, getById };
        })();

        // --- 3. UI, MODAL & TOAST ---
        const UI = (function() {
            let modalTimer;
            const showToast = (msg, type = 'success') => {
                const c = document.getElementById('toast-container');
                const t = document.createElement('div'); t.className = `toast ${type}`;
                const icon = type === 'success' 
                    ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>` 
                    : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;
                t.innerHTML = `${icon} <span>${Utils.escapeHTML(msg)}</span>`;
                c.appendChild(t);
                setTimeout(() => t.classList.add('show'), 10);
                setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3000);
            };

            const openModal = (html, noClose = false) => {
                const o = document.getElementById('modalOverlay'), c = document.getElementById('modalCard');
                c.innerHTML = html;
                o.classList.add('active');
                o.onclick = noClose ? null : (e) => { if(e.target === o) closeModal(); };
            };
            
            const closeModal = () => {
                const o = document.getElementById('modalOverlay');
                o.classList.remove('active');
                clearTimeout(modalTimer);
                modalTimer = setTimeout(() => document.getElementById('modalCard').innerHTML = '', 300);
            };

            const confirmDialog = (title, message, confirmText, confirmClass, onConfirm) => {
                openModal(`
                    <div class="modal-header"><div class="modal-title">${title}</div><button class="modal-close" onclick="UI.closeModal()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></div>
                    <div class="modal-body"><p>${message}</p></div>
                    <div class="modal-footer">
                        <button class="btn btn-outline" onclick="UI.closeModal()">Batal</button>
                        <button class="btn ${confirmClass}" id="btnConfirmGlobal">${confirmText}</button>
                    </div>
                `, true); // True = no close on click outside
                document.getElementById('btnConfirmGlobal').onclick = () => { onConfirm(); closeModal(); };
            };

            return { showToast, openModal, closeModal, confirmDialog };
        })();

        // --- 4. BUSINESS LOGIC ---
        const AppLogic = (function() {
            const getSantriPoints = (sId, excludeId = null) => Storage.get('pelanggaran').reduce((sum, p) => (p.santriId === sId && p.id !== excludeId) ? sum + (parseInt(p.poin)||0) : sum, 0);
            const getSantriPointsInRange = (sId, start, end) => Storage.get('pelanggaran').reduce((sum, p) => (p.santriId === sId && Utils.inRange(p.tanggal, start, end)) ? sum + (parseInt(p.poin)||0) : sum, 0);
            
            const getPenanganan = (pts) => {
                const p = Storage.get('penanganan').sort((a,b) => b.minPoin - a.minPoin).find(x => pts >= x.minPoin);
                return p ? { id: p.id, nama: p.nama, warna: p.warna } : { id: null, nama: 'Aman', warna: 'gray' };
            };

            const showSantriDetail = (sId) => {
                const santri = Storage.getById('santri', sId);
                if(!santri) return;
                const kelas = Storage.getById('kelas', santri.kelasId) || {nama: '-'};
                const totalPts = getSantriPoints(sId);
                const penanganan = getPenanganan(totalPts);
                const riwayat = Storage.get('pelanggaran').filter(p => p.santriId === sId).sort((a,b) => new Date(b.tanggal) - new Date(a.tanggal));
                
                const rows = riwayat.map(p => `<tr><td>${Utils.formatDate(p.tanggal)}</td><td>${Utils.escapeHTML(p.kategoriNama)}</td><td><strong>${p.poin}</strong></td></tr>`).join('');
                const tbl = riwayat.length === 0 ? '<div class="empty-state" style="padding:20px"><p class="empty-desc">Belum ada riwayat pelanggaran.</p></div>' : `<table class="table" style="font-size:13px"><thead><tr><th>Tanggal</th><th>Pelanggaran</th><th>Poin</th></tr></thead><tbody>${rows}</tbody></table>`;

                UI.openModal(`
                    <div class="modal-header"><div class="modal-title">Detail Santri</div><button class="modal-close" onclick="UI.closeModal()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></div>
                    <div class="modal-body">
                        <div style="display:flex; gap:20px; align-items:center; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--border); flex-wrap:wrap">
                            <div style="flex:1; min-width:200px">
                                <h3 style="font-size:20px;font-weight:700;margin-bottom:4px">${Utils.escapeHTML(santri.nama)}</h3>
                                <p style="color:var(--text-muted);font-size:14px;margin-bottom:8px">Kelas: <strong>${Utils.escapeHTML(kelas.nama)}</strong> | Status: ${santri.status}</p>
                                <span class="badge ${Utils.colorMap[penanganan.warna] || 'gray'}">${penanganan.nama}</span>
                            </div>
                            <div style="text-align:center; background:var(--surface-hover); padding:16px; border-radius:var(--radius-md); min-width:120px">
                                <div style="font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:4px">TOTAL POIN</div>
                                <div style="font-size:28px; font-weight:700; color:var(--${Utils.colorMap[penanganan.warna] || 'text-main'})">${totalPts}</div>
                            </div>
                        </div>
                        <h4 style="font-size:14px;font-weight:600;margin-bottom:12px">Riwayat Keseluruhan (${riwayat.length})</h4>
                        <div class="card table-container" style="box-shadow:none; border:1px solid var(--border)">${tbl}</div>
                    </div>
                `);
            };

            return { getSantriPoints, getSantriPointsInRange, getPenanganan, showSantriDetail };
        })();

        // --- 5. VIEWS MODULES ---

        // ================= DASHBOARD =================
        const ViewDashboard = {
            render: () => {
                const pl = Storage.get('pelanggaran'), activeSantri = Storage.get('santri').filter(s => s.status === 'Aktif');
                const plToday = pl.filter(p => Utils.isToday(p.tanggal)), plWeek = pl.filter(p => Utils.isThisWeek(p.tanggal)), plMonth = pl.filter(p => Utils.isThisMonth(p.tanggal));
                
                const pointsWeek = plWeek.reduce((sum, p) => sum + parseInt(p.poin), 0);
                const penangananCountWeek = plWeek.filter(p => p.penangananId).length;
                
                const catMap = {}; plWeek.forEach(p => catMap[p.kategoriNama] = (catMap[p.kategoriNama] || 0) + 1);
                const topCatStr = Object.keys(catMap).length > 0 ? Object.keys(catMap).reduce((a, b) => catMap[a] > catMap[b] ? a : b) : '-';

                const santriWarning = activeSantri.map(s => {
                    const pts = AppLogic.getSantriPoints(s.id);
                    if(pts > 0) { const pen = AppLogic.getPenanganan(pts); if(pen.id) return { id: s.id, nama: s.nama, poin: pts, pen: pen.nama, warna: pen.warna }; }
                    return null;
                }).filter(Boolean).sort((a,b) => b.poin - a.poin);

                // Charts
                const maxDay = Math.max(...Utils.getPast7Days().map(d => pl.filter(p => p.tanggal === d.date).length), 1);
                const chartHari = Utils.getPast7Days().map(d => {
                    const count = pl.filter(p => p.tanggal === d.date).length;
                    return `<div class="chart-col chart-col-clickable" onclick="ViewDashboard.showDayDetail('${d.date}')" title="Klik untuk lihat detail"><div class="chart-val">${count||''}</div><div class="chart-bar" style="height:${(count/maxDay)*100}%;"></div><div class="chart-lbl">${d.label}</div></div>`;
                }).join('');

                const sortedCats = Object.keys(catMap).sort((a,b) => catMap[b] - catMap[a]).slice(0, 5);
                const maxCat = Math.max(...sortedCats.map(c => catMap[c]), 1);
                const chartKategori = sortedCats.length > 0 ? sortedCats.map(c => `<div class="chart-col chart-col-clickable" onclick="ViewDashboard.showCategoryDetail('${c.replace(/'/g,"\\'")}')" title="Klik untuk lihat detail"><div class="chart-val">${catMap[c]}</div><div class="chart-bar" style="height:${(catMap[c]/maxCat)*100}%;"></div><div class="chart-lbl" title="${c}">${c.substring(0,5)}..</div></div>`).join('') : '<div style="width:100%;text-align:center;color:var(--text-muted);font-size:12px;margin-bottom:10px">Belum ada data</div>';

                document.getElementById('mainContent').innerHTML = `
                    <div class="page-header"><h2 class="page-title">Dashboard</h2><p class="page-subtitle">Informasi pembinaan santri terpusat & Real-Time.</p></div>
                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:20px; margin-bottom:24px;">
                        <div class="card card-body" style="border-left: 4px solid var(--info)"><div style="font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:8px">HARI INI</div><div style="font-size:28px;font-weight:700">${plToday.length} <span style="font-size:12px;font-weight:normal;color:var(--text-muted)">Kasus</span></div></div>
                        <div class="card card-body" style="border-left: 4px solid var(--warning)"><div style="font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:8px">MINGGU INI</div><div style="font-size:28px;font-weight:700">${plWeek.length} <span style="font-size:12px;font-weight:normal;color:var(--text-muted)">Kasus</span></div></div>
                        <div class="card card-body" style="border-left: 4px solid var(--primary)"><div style="font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:8px">BULAN INI</div><div style="font-size:28px;font-weight:700">${plMonth.length} <span style="font-size:12px;font-weight:normal;color:var(--text-muted)">Kasus</span></div></div>
                        <div class="card card-body" style="border-left: 4px solid var(--success)"><div style="font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:8px">SANTRI AKTIF</div><div style="font-size:28px;font-weight:700">${activeSantri.length} <span style="font-size:12px;font-weight:normal;color:var(--text-muted)">Orang</span></div></div>
                        <div class="card card-body card-interactive" onclick="Views.load('rekap')" style="border-left: 4px solid var(--danger)"><div style="font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:8px">PERLU PENANGANAN</div><div style="font-size:28px;font-weight:700;color:var(--danger)">${santriWarning.length} <span style="font-size:12px;font-weight:normal;color:var(--text-muted)">Orang ➝</span></div></div>
                        <div class="card card-body" style="border-left: 4px solid var(--border)"><div style="font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:8px">TERBANYAK (MINGGU)</div><div style="font-size:16px;font-weight:600;line-height:1.2;margin-top:8px" title="${topCatStr}">${topCatStr.length > 25 ? topCatStr.substring(0,25)+'...' : topCatStr}</div></div>
                        <div class="card card-body" style="border-left: 4px solid var(--warning)"><div style="font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:8px">POIN (MINGGU INI)</div><div style="font-size:28px;font-weight:700">${pointsWeek} <span style="font-size:12px;font-weight:normal;color:var(--text-muted)">Pts</span></div></div>
                        <div class="card card-body" style="border-left: 4px solid var(--primary)"><div style="font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:8px">TINDAKAN (MINGGU)</div><div style="font-size:28px;font-weight:700">${penangananCountWeek} <span style="font-size:12px;font-weight:normal;color:var(--text-muted)">Aksi</span></div></div>
                    </div>
                    <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap:24px">
                        <div class="card" style="grid-row: span 2; display:flex; flex-direction:column;">
                            <div style="padding:16px 24px; border-bottom:1px solid var(--border); font-weight:600; background:var(--surface-hover)">⚠️ Perlu Penanganan Segera</div>
                            <div style="padding:0 24px; overflow-y:auto; flex:1; max-height:400px">
                                ${santriWarning.length > 0 ? santriWarning.map(s => `
                                    <div style="padding:16px 0; border-bottom:1px dashed var(--border); display:flex; justify-content:space-between; align-items:center">
                                        <div><div style="margin-bottom:4px"><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--${Utils.colorMap[s.warna]});margin-right:6px"></span><a href="#" class="clickable-name" onclick="AppLogic.showSantriDetail('${s.id}')">${Utils.escapeHTML(s.nama)}</a></div><div style="font-size:12px;color:var(--text-muted)">${s.pen}</div></div>
                                        <div style="font-weight:700;font-size:18px">${s.poin}<span style="font-size:12px;font-weight:normal;color:var(--text-muted)">pts</span></div>
                                    </div>
                                `).join('') : '<div class="empty-state" style="padding:40px 0"><p class="empty-desc">Tidak ada santri di ambang peringatan.</p></div>'}
                            </div>
                        </div>
                        <div class="card"><div style="padding:16px 24px; border-bottom:1px solid var(--border); font-weight:600; font-size:14px">Grafik 7 Hari Terakhir</div><div class="css-chart">${chartHari}</div></div>
                        <div class="card"><div style="padding:16px 24px; border-bottom:1px solid var(--border); font-weight:600; font-size:14px">Top 5 Kategori (Minggu Ini)</div><div class="css-chart">${chartKategori}</div></div>
                    </div>
                `;
            },
            showDayDetail: (dateStr) => {
                const items = Storage.get('pelanggaran').filter(p => p.tanggal === dateStr);
                const sMap = {}; Storage.get('santri').forEach(s => sMap[s.id] = s.nama);
                const rows = items.map(p => `<tr><td>${Utils.escapeHTML(sMap[p.santriId] || 'Tidak diketahui')}</td><td>${Utils.escapeHTML(p.kategoriNama)}</td><td><strong>${p.poin}</strong></td></tr>`).join('');
                const tbl = items.length === 0
                    ? '<div class="empty-state" style="padding:20px"><p class="empty-desc">Tidak ada pelanggaran pada tanggal ini.</p></div>'
                    : `<table class="table" style="font-size:13px"><thead><tr><th>Santri</th><th>Pelanggaran</th><th>Poin</th></tr></thead><tbody>${rows}</tbody></table>`;
                UI.openModal(`
                    <div class="modal-header"><div class="modal-title">Pelanggaran • ${Utils.formatDate(dateStr)}</div><button class="modal-close" onclick="UI.closeModal()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></div>
                    <div class="modal-body">
                        <p style="font-size:13px;color:var(--text-muted);margin-bottom:16px">Total <strong>${items.length}</strong> kasus pada hari ini.</p>
                        <div class="card table-container" style="box-shadow:none; border:1px solid var(--border)">${tbl}</div>
                    </div>
                `);
            },
            showCategoryDetail: (kategoriNama) => {
                const items = Storage.get('pelanggaran').filter(p => Utils.isThisWeek(p.tanggal) && p.kategoriNama === kategoriNama);
                const sMap = {}; Storage.get('santri').forEach(s => sMap[s.id] = s.nama);
                const counts = {};
                items.forEach(p => { counts[p.santriId] = (counts[p.santriId] || 0) + 1; });

        const MasterPenanganan = {

                const cOpts = ['Hijau','Kuning','Oranye','Merah'].map(c => `<option value="${c}" ${c===d.warna?'selected':''}>${c}</option>`).join('');

        // ================= TRANSAKSI (Input & Riwayat) =================
        const ViewInput = {
            editId: null,
            render: (editData = null) => {
                ViewInput.editId = editData ? editData.id : null;
                const santriList = Storage.get('santri').filter(s => s.status === 'Aktif').sort((a,b)=>a.nama.localeCompare(b.nama));

                const kMap = {}; Storage.get('kelas').forEach(k => kMap[k.id] = k.nama);
                const sOpts = santriList.map(s => `<option value="${s.id}" data-kelas="${kMap[s.kelasId]||'-'}">${Utils.escapeHTML(s.nama)}</option>`).join('');
                const kOpts = katList.map(k => `<option value="${k.id}" data-kel="${k.kelompok}" data-pt="${k.poin}">${Utils.escapeHTML(k.nama)}</option>`).join('');
                const today = editData ? editData.tanggal : Utils.getTodayYMD();

                document.getElementById('mainContent').innerHTML = `
                    <div class="page-header"><h2 class="page-title">${editData?'Edit':'Input'} Pelanggaran</h2><p class="page-subtitle">Poin dan penanganan dikalkulasi otomatis secara Real-Time.</p></div>
                    <form id="frmInput" class="card card-body" style="max-width:900px; margin:0 auto">
                        <div class="form-grid">
                            <div>
                                <div class="form-group"><label class="form-label">Tanggal</label><input type="date" id="iTgl" class="form-control" required value="${today}"></div>

                                <div class="form-group"><label class="form-label">Kelas</label><input type="text" id="iKelas" class="form-control" readonly tabindex="-1"></div>
                            </div>
                            <div>
                                <div class="form-group"><label class="form-label">Kategori</label><select id="iKat" class="form-control" required><option value="">--Pilih--</option>${kOpts}</select></div>
                                <div class="form-grid" style="gap:16px">
                                    <div class="form-group"><label class="form-label">Kelompok</label><input type="text" id="iKel" class="form-control" readonly tabindex="-1"></div>
                                    <div class="form-group"><label class="form-label">Poin</label><input type="text" id="iPoin" class="form-control" readonly tabindex="-1"></div>
                                </div>
                                <div class="form-group"><label class="form-label">Catatan</label><textarea id="iCat" class="form-control"></textarea></div>
                            </div>
                        </div>
                        <div id="pnlHandle" class="panel-penanganan level-gray">
                            <div class="panel-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle></svg></div>
                            <div><div class="panel-title">Tindakan Penanganan</div><div class="panel-value" id="lblHandle">Belum ada</div><div style="font-size:13px;opacity:0.9" id="lblTotPts">Pilih santri</div></div>
                        </div>
                        <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:24px">
                            ${editData ? `<button type="button" class="btn btn-outline" onclick="Views.load('riwayat')">Batal</button>` : ''}
                            <button type="submit" class="btn btn-primary">Simpan Otomatis</button>
                        </div>
                    </form>
                `;

                // Logic Live Calculation
                const $ = id => document.getElementById(id);
                const calc = () => {
                    const sId = $('iSantri').value;
                    if(!sId) return;
                    const basePts = AppLogic.getSantriPoints(sId, ViewInput.editId);
                    const addPts = parseInt($('iPoin').value) || 0;
                    const tot = basePts + addPts;
                    const pen = AppLogic.getPenanganan(tot);
                    
                    $('pnlHandle').className = `panel-penanganan level-${Utils.colorMap[pen.warna]||'gray'}`;
                    $('lblHandle').textContent = pen.nama;
                    $('lblTotPts').innerHTML = `Proyeksi: <strong>${tot}</strong> Pts (Lama ${basePts} + Baru ${addPts})`;

                $('iTgl').onchange = () => $('iHari').value = Utils.getDayName($('iTgl').value);
                $('iSantri').onchange = (e) => { const o = e.target.options[e.target.selectedIndex]; $('iKelas').value = o.dataset.kelas||''; calc(); };

                // Submit Save

                    e.preventDefault();

                    const data = {
                        tanggal: $('iTgl').value, hari: $('iHari').value,

                        kategoriNama: oKat.text, kelompok: oKat.dataset.kel, poin: parseInt(oKat.dataset.pt),

                    if(ViewInput.editId) { Storage.update('pelanggaran', ViewInput.editId, data); UI.showToast('Data diubah'); Views.load('riwayat'); }
                    else { Storage.insert('pelanggaran', data); UI.showToast('Tersimpan otomatis'); $('iSantri').value=''; $('iKat').value=''; $('iCat').value=''; $('iSantri').dispatchEvent(new Event('change')); $('iKat').dispatchEvent(new Event('change')); }
                };

                $('iTgl').dispatchEvent(new Event('change'));
                if(editData) {
                    $('iSantri').value = editData.santriId; $('iKat').value = editData.kategoriId; $('iCat').value = editData.catatan;
                    $('iSantri').dispatchEvent(new Event('change')); $('iKat').dispatchEvent(new Event('change'));

            }

                    <div class="page-header"><h2 class="page-title">Riwayat Pelanggaran</h2></div>
                    <div class="toolbar"><div class="toolbar-left" style="flex:2">
                        <div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle></svg><input type="text" id="srchR" class="search-input" placeholder="Cari santri..."></div>
                        <input type="date" id="dtR" class="filter-select">
                        <select id="srtR" class="filter-select"><option value="desc">Terbaru</option><option value="asc">Terlama</option></select>
                    </div></div>
                    <div id="tblRiwayatWrapper"></div>
                `;
                ViewRiwayat.loadTable();
                ['srchR','dtR','srtR'].forEach(id => document.getElementById(id).addEventListener('input', ViewRiwayat.loadTable));
            },
            loadTable: () => {
                const q = document.getElementById('srchR').value.toLowerCase(), d = document.getElementById('dtR').value, sort = document.getElementById('srtR').value;
                const sMap = {}; Storage.get('santri').forEach(s => sMap[s.id] = s.nama);
                const kMap = {}; Storage.get('kelas').forEach(k => kMap[k.id] = k.nama);
                const sKelMap = {}; Storage.get('santri').forEach(s => sKelMap[s.id] = kMap[s.kelasId]||'-');
                
                let data = Storage.get('pelanggaran').map(p => ({...p, sNama: sMap[p.santriId]||'Unknown', kNama: sKelMap[p.santriId]}));
                data = data.filter(p => p.sNama.toLowerCase().includes(q) && (d === '' || p.tanggal === d));
                data.sort((a,b) => sort === 'desc' ? new Date(b.tanggal) - new Date(a.tanggal) : new Date(a.tanggal) - new Date(b.tanggal));

                const wrapper = document.getElementById('tblRiwayatWrapper');
                if(!data.length) return wrapper.innerHTML = CrudModule.emptyState('Riwayat kosong atau tidak sesuai filter.');

                const rows = data.map(p => {
                    const badg = p.kelompok==='Ibadah'?'green':(p.kelompok==='Disiplin'?'orange':'yellow');
                    return `<tr>
                        <td data-label="Tgl"><strong>${Utils.formatDate(p.tanggal)}</strong><br><small style="color:var(--text-muted)">${p.hari}</small></td>
                        <td data-label="Santri"><a href="#" class="clickable-name" onclick="AppLogic.showSantriDetail('${p.santriId}')">${Utils.escapeHTML(p.sNama)}</a><br><small style="color:var(--text-muted)">Kls ${p.kNama}</small></td>
                        <td data-label="Pelanggaran">${Utils.escapeHTML(p.kategoriNama)}<br><span class="badge ${badg}" style="margin-top:4px">${p.kelompok}</span></td>
                        <td data-label="Poin"><strong>${p.poin}</strong></td>
                        <td data-label="Aksi">${CrudModule.btnAction(`ViewRiwayat.edit('${p.id}')`, `ViewRiwayat.del('${p.id}')`)}</td>
                    </tr>`;
                }).join('');
                wrapper.innerHTML = `<div class="card table-container"><table class="table"><thead><tr><th>Tanggal</th><th>Santri</th><th>Pelanggaran</th><th>Poin</th><th width="100">Aksi</th></tr></thead><tbody>${rows}</tbody></table></div>`;
            },
            edit: (id) => { const d = Storage.getById('pelanggaran', id); if(d) { Views.setActiveMenu('input'); ViewInput.render(d); } },
            del: (id) => UI.confirmDialog('Hapus Riwayat', 'Hapus riwayat ini? Poin akan disesuaikan otomatis.', 'Hapus', 'btn-danger', () => { Storage.remove('pelanggaran', id); UI.showToast('Data dihapus'); ViewRiwayat.render(); })
        };

        const ViewRekap = {
            tab: 'Mingguan',
            weekOffset: 0,
            monthOffset: 0,
            render: () => {
                document.getElementById('mainContent').innerHTML = `
                    <div class="page-header"><h2 class="page-title">Rekapitulasi</h2><p class="page-subtitle">Rekap mingguan otomatis mulai Senin & terpisah setiap pekan (reset tiap Minggu malam); rekap bulanan otomatis terpisah tiap bulan.</p></div>
                    <div class="tabs">${['Harian', 'Mingguan', 'Bulanan', 'Semua Data'].map(t => `<button class="tab-btn ${ViewRekap.tab === t ? 'active' : ''}" onclick="ViewRekap.setTab('${t}')">${t}</button>`).join('')}</div>
                    ${ViewRekap.renderPeriodNav()}
                    <div class="toolbar"><div class="toolbar-left">
                        <div class="search-box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle></svg><input type="text" id="rSch" class="search-input" placeholder="Cari santri..."></div>
                        <select id="rSrt" class="filter-select"><option value="p_desc">Poin Periode Tertinggi</option><option value="p_asc">Poin Periode Terendah</option></select>
                    </div></div>
                    <div id="tblRekapWrapper"></div>
                `;
                ViewRekap.loadTable();
                ['rSch','rSrt'].forEach(id => document.getElementById(id).addEventListener('input', ViewRekap.loadTable));
            },
            setTab: (t) => { ViewRekap.tab = t; ViewRekap.weekOffset = 0; ViewRekap.monthOffset = 0; Views.load('rekap'); },
            navPeriod: (dir) => {
                if(ViewRekap.tab === 'Mingguan') { if(ViewRekap.weekOffset + dir <= 0) ViewRekap.weekOffset += dir; }
                else if(ViewRekap.tab === 'Bulanan') { if(ViewRekap.monthOffset + dir <= 0) ViewRekap.monthOffset += dir; }
                Views.load('rekap');
            },
            getRange: () => {
                if(ViewRekap.tab === 'Harian') { const s = new Date(); s.setHours(0,0,0,0); const e = new Date(); e.setHours(23,59,59,999); return { start: s, end: e }; }
                if(ViewRekap.tab === 'Mingguan') return Utils.getWeekRange(ViewRekap.weekOffset);
                if(ViewRekap.tab === 'Bulanan') return Utils.getMonthRange(ViewRekap.monthOffset);
                return null; // Semua Data
            },
            renderPeriodNav: () => {
                if(ViewRekap.tab === 'Mingguan') {
                    const { start, end } = Utils.getWeekRange(ViewRekap.weekOffset);
                    const weekNum = Utils.getWeekOfMonth(start);
                    const isCurrent = ViewRekap.weekOffset >= 0;
                    return `<div class="card card-body period-nav" style="margin-bottom:20px">
                        <button class="btn btn-outline period-nav-btn" onclick="ViewRekap.navPeriod(-1)">◀ Minggu Sebelumnya</button>
                        <div style="text-align:center">
                            <div style="font-weight:700">Minggu ke-${weekNum} • ${Utils.monthNames[start.getMonth()]} ${start.getFullYear()}${ViewRekap.weekOffset===0?' (Berjalan)':''}</div>
                            <div style="font-size:12px;color:var(--text-muted)">${Utils.formatDate(Utils.toYMD(start))} - ${Utils.formatDate(Utils.toYMD(end))}</div>
                        </div>
                        <button class="btn btn-outline period-nav-btn" ${isCurrent?'disabled':''} onclick="ViewRekap.navPeriod(1)">Minggu Berikutnya ▶</button>
                    </div>`;
                }
                if(ViewRekap.tab === 'Bulanan') {
                    const { start } = Utils.getMonthRange(ViewRekap.monthOffset);
                    const isCurrent = ViewRekap.monthOffset >= 0;
                    return `<div class="card card-body period-nav" style="margin-bottom:20px">
                        <button class="btn btn-outline period-nav-btn" onclick="ViewRekap.navPeriod(-1)">◀ Bulan Sebelumnya</button>
                        <div style="font-weight:700">${Utils.monthNames[start.getMonth()]} ${start.getFullYear()}${ViewRekap.monthOffset===0?' (Berjalan)':''}</div>
                        <button class="btn btn-outline period-nav-btn" ${isCurrent?'disabled':''} onclick="ViewRekap.navPeriod(1)">Bulan Berikutnya ▶</button>
                    </div>`;
                }
                return '';
            },
            loadTable: () => {
                const q = document.getElementById('rSch').value.toLowerCase(), srt = document.getElementById('rSrt').value;
                const kMap = {}; Storage.get('kelas').forEach(k => kMap[k.id] = k.nama);
                const pl = Storage.get('pelanggaran');
                const range = ViewRekap.getRange();

                let rData = [];
                Storage.get('santri').filter(s => s.status === 'Aktif' && s.nama.toLowerCase().includes(q)).forEach(s => {
                    const plPeriode = range ? pl.filter(p => p.santriId === s.id && Utils.inRange(p.tanggal, range.start, range.end)) : pl.filter(p => p.santriId === s.id);
                    const jml = plPeriode.length;
                    if(ViewRekap.tab !== 'Semua Data' && jml === 0) return;
                    const periodePts = plPeriode.reduce((sum,p) => sum + (parseInt(p.poin)||0), 0);
                    const totalPts = AppLogic.getSantriPoints(s.id), pen = AppLogic.getPenanganan(totalPts);
                    rData.push({ id: s.id, nama: s.nama, kelas: kMap[s.kelasId]||'-', jml, periodePts, totalPts, pen });
                });

                rData.sort((a,b) => srt === 'p_desc' ? b.periodePts - a.periodePts : a.periodePts - b.periodePts);
                const w = document.getElementById('tblRekapWrapper');
                if(!rData.length) return w.innerHTML = CrudModule.emptyState(`Tidak ada data untuk periode ${ViewRekap.tab}.`);

                const rows = rData.map(i => `<tr>
                    <td data-label="Santri"><a href="#" class="clickable-name" onclick="AppLogic.showSantriDetail('${i.id}')">${Utils.escapeHTML(i.nama)}</a></td>
                    <td data-label="Kelas">${Utils.escapeHTML(i.kelas)}</td>
                    <td data-label="Kasus (Periode)"><strong>${i.jml}</strong> kasus</td>
                    <td data-label="Poin (Periode)"><strong>${i.periodePts}</strong></td>
                    <td data-label="Total Poin">${i.totalPts}</td>
                    <td data-label="Status"><span class="badge ${Utils.colorMap[i.pen.warna]||'gray'}">${i.pen.nama}</span></td>
                </tr>`).join('');
                w.innerHTML = `<div class="card table-container"><table class="table"><thead><tr><th>Nama Santri</th><th>Kelas</th><th>Kasus (Periode)</th><th>Poin (Periode)</th><th>Total Poin</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
            }
        };

        // ================= PENGATURAN (Phase 5 Finalisasi) =================
        const ViewPengaturan = {
            render: () => {
                const t = localStorage.getItem('sips_theme') || 'light';
                document.getElementById('mainContent').innerHTML = `
                    <div class="page-header"><h2 class="page-title">Pengaturan</h2><p class="page-subtitle">Sistem, Tampilan & Manajemen Data PWA v1.0</p></div>
                    
                    <div class="card card-body" style="max-width: 600px; margin-bottom: 24px">
                        <h3 style="font-size: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px;">Tampilan (UI)</h3>
                        <div style="display:flex; align-items:center; gap:16px;">
                            <button class="theme-toggle" style="width:48px;height:48px;font-size:20px" onclick="ViewPengaturan.toggleTheme()">${t==='dark'?'🌙':'☀️'}</button>
                            <div>
                                <div style="font-weight:600; font-size:14px">Tema saat ini: ${t==='dark'?'Gelap (Dark Mode)':'Terang (Light Mode)'}</div>
                                <p style="font-size:13px; color:var(--text-muted); margin-top:4px">Ganti tema kapan saja lewat ikon ☀️/🌙 di pojok kanan atas halaman.</p>
                            </div>
                        </div>
                    </div>

                    <div class="card card-body" style="max-width: 600px; margin-bottom: 24px">
                        <h3 style="font-size: 16px; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px;">Manajemen Data (Backup/Restore)</h3>
                        <p style="font-size:13px; color:var(--text-muted); margin-bottom: 16px;">Karena aplikasi berjalan secara lokal (Offline PWA), Anda wajib melakukan backup data secara berkala untuk menghindari kehilangan data jika browser dibersihkan.</p>
                        
                        <div style="display:flex; flex-direction:column; gap:12px;">
                            <button class="btn btn-outline" onclick="ViewPengaturan.backup()" style="justify-content:flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Backup ke File (.json)</button>
                            <button class="btn btn-outline" onclick="document.getElementById('restoreFileInput').click()" style="justify-content:flex-start"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg> Restore dari File (.json)</button>
                            <button class="btn btn-outline" style="color:var(--danger); border-color:var(--danger); justify-content:flex-start; margin-top:24px" onclick="ViewPengaturan.reset()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg> Kosongkan Seluruh Data Sistem</button>
                        </div>
                    </div>
                `;
            },
            setTheme: (t) => { document.documentElement.setAttribute('data-theme', t); localStorage.setItem('sips_theme', t); ViewPengaturan.updateThemeIcon(); UI.showToast(t === 'dark' ? 'Mode gelap diaktifkan.' : 'Mode terang diaktifkan.'); },
            toggleTheme: () => { const cur = localStorage.getItem('sips_theme') || 'light'; ViewPengaturan.setTheme(cur === 'light' ? 'dark' : 'light'); if(Views.getActive() === 'pengaturan') ViewPengaturan.render(); },
            updateThemeIcon: () => { const t = localStorage.getItem('sips_theme') || 'light'; const btn = document.getElementById('themeToggle'); if(btn) btn.textContent = t === 'dark' ? '🌙' : '☀️'; },
            backup: () => {
                const data = {}; Object.keys(localStorage).forEach(k => { if(k.startsWith('sips_')) data[k] = localStorage.getItem(k); });
                const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                a.download = `backup-sips-${Utils.getTodayYMD()}.json`; a.click();
                UI.showToast('Backup berhasil diunduh.');
            },
            handleRestore: (e) => {
                const file = e.target.files[0]; if(!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const d = JSON.parse(ev.target.result);
                        if(!d['sips_pengaturan']) throw new Error('Invalid format');
                        Object.keys(localStorage).forEach(k => { if(k.startsWith('sips_')) localStorage.removeItem(k); });
                        Object.keys(d).forEach(k => localStorage.setItem(k, d[k]));
                        UI.showToast('Restore berhasil! Memuat ulang sistem...');
                        setTimeout(() => location.reload(), 1500);
                    } catch(err) { UI.showToast('File backup tidak valid.', 'error'); e.target.value = ''; }
                };
                reader.readAsText(file);
            },
            reset: () => {
                UI.confirmDialog('Reset Pabrik', 'Seluruh data akan dihapus permanen dan tidak dapat dikembalikan. Lanjutkan?', 'Ya, Hapus Semua', 'btn-danger', () => {
                    Object.keys(localStorage).forEach(k => { if(k.startsWith('sips_')) localStorage.removeItem(k); });
                    UI.showToast('Data berhasil direset.'); setTimeout(() => location.reload(), 1000);
                });
            }
        };

        // --- 6. ROUTER & SYSTEM CORE ---
        const Views = (function() {
            let active = 'dashboard';
            const m = { dashboard: ViewDashboard.render, kelas: MasterKelas.render, santri: MasterSantri.render, kategori: MasterKategori.render, penanganan: MasterPenanganan.render, input: ViewInput.render, riwayat: ViewRiwayat.render, rekap: ViewRekap.render, pengaturan: ViewPengaturan.render };
            
            const load = (v) => { if(m[v]) { active = v; m[v](); window.scrollTo(0,0); } };
            const setActiveMenu = (v) => { document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active')); const el = document.querySelector(`.menu-item[data-view="${v}"]`); if(el) el.classList.add('active'); };
            return { load, setActiveMenu, getActive: () => active };
        })();

        // --- APP BOOTSTRAP ---
        document.addEventListener('DOMContentLoaded', () => {
            Storage.init();
            
            // Apply Theme
            const t = localStorage.getItem('sips_theme') || 'light'; document.documentElement.setAttribute('data-theme', t);
            ViewPengaturan.updateThemeIcon();

            // Register Restore Event
            document.getElementById('restoreFileInput').addEventListener('change', ViewPengaturan.handleRestore);

            // Sidebar UX
            const mt = document.getElementById('menuToggle'), sb = document.getElementById('sidebar'), ov = document.getElementById('sidebarOverlay');
            const tog = () => { sb.classList.toggle('open'); ov.classList.toggle('active'); };
            mt.onclick = tog; ov.onclick = tog;

            // Nav Delegation
            document.querySelectorAll('.menu-item').forEach(i => i.addEventListener('click', (e) => {
                const v = e.currentTarget.getAttribute('data-view');
                Views.setActiveMenu(v); Views.load(v);
                if(window.innerWidth <= 768) tog();
            }));

            // Exit Trap (Back Button Handler)
            window.history.pushState({ noBack: true }, ''); // Init state
            window.addEventListener('popstate', () => {
                if(Views.getActive() === 'dashboard') {
                    window.history.pushState({ noBack: true }, ''); // Re-push trap
                    UI.confirmDialog('Keluar Aplikasi', 'Keluar dari aplikasi SIPS?', 'Ya, Keluar', 'btn-danger', () => {
                        window.onpopstate = null; // Remove trap
                        window.history.back(); // Let OS handle exit
                    });
                } else {
                    Views.setActiveMenu('dashboard'); Views.load('dashboard');
                    window.history.pushState({ noBack: true }, ''); // Re-push trap
                }
            });

            // Initial Load (Auto Load all stats on open)
            Views.load('dashboard');

            // PWA Service Worker Registration
            if('serviceWorker' in navigator) {
                navigator.serviceWorker.register('service-worker.js').catch(err => console.log('SW Reg Failed', err));
            }
        });
    </script>
</body>
</html>
